<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Rind Gradient -->
    <radialGradient id="limeRind" cx="45%" cy="42%" r="60%">
      <stop offset="78%" stop-color="#1b5e20"/>
      <stop offset="90%" stop-color="#2e7d32"/>
      <stop offset="97%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </radialGradient>
    <!-- Pith Gradient -->
    <radialGradient id="limePith" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#ffffff"/>
      <stop offset="95%" stop-color="#f1f8e9"/>
      <stop offset="100%" stop-color="#dcedc8"/>
    </radialGradient>
    <!-- Segment Gradient -->
    <radialGradient id="limeSegment" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d4e157"/>
      <stop offset="45%" stop-color="#aeea00"/>
      <stop offset="80%" stop-color="#7cb342"/>
      <stop offset="100%" stop-color="#558b2f"/>
    </radialGradient>
    <!-- Leaf Gradient -->
    <linearGradient id="limeLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66bb6a"/>
      <stop offset="50%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <filter id="limeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="3" dy="8" stdDeviation="6" flood-color="#0a2a0a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#limeShadow)">
    <!-- Leaves behind -->
    <g transform="translate(142, 42) rotate(35)">
      <path d="M0,0 C25,-20 48,-5 42,22 C36,45 12,35 0,0 Z" fill="url(#limeLeaf)"/>
      <path d="M0,0 Q24,6 40,20" stroke="#a5d6a7" stroke-width="2" fill="none"/>
    </g>

    <!-- Outer Rind -->
    <circle cx="100" cy="105" r="76" fill="url(#limeRind)"/>

    <!-- Pith (White ring) -->
    <circle cx="100" cy="105" r="68" fill="url(#limePith)"/>

    <!-- 8 Triangular Citrus Pulp Wedges -->
    <!-- Wedge 1 (Top) -->
    <path d="M100,105 L94,52 C98,51 102,51 106,52 Z" fill="none"/>
    <!-- We generate 8 distinct wedges using precise path angles around (100, 105) -->
    <!-- Center r=12, Outer r=64 -->
    <!-- Wedge 0 (0 deg, top) -->
    <path d="M96,93 Q98,54 100,50 Q102,54 104,93 Q100,95 96,93 Z" fill="none"/>

    <!-- Group of 8 wedges with rotation -->
    <g transform="translate(100, 105)">
      <!-- 8 wedges at 45 degree intervals -->
      <!-- Wedge template: path centered around angle 0 (pointing up) -->
      <!-- Angle = -18 to +18 deg, r=12 to 62 -->
      <g>
        <!-- Loop simulated with 8 rotated groups -->
        <!-- 0 deg -->
        <path d="M-4,-12 L-19,-58 C-7,-62 7,-62 19,-58 L4,-12 Q0,-10 -4,-12 Z" fill="url(#limeSegment)"/>
        <!-- 45 deg -->
        <g transform="rotate(45)">
          <path d="M-4,-12 L-19,-58 C-7,-62 7,-62 19,-58 L4,-12 Q0,-10 -4,-12 Z" fill="url(#limeSegment)"/>
        </g>
        <!-- 90 deg -->
        <g transform="rotate(90)">
          <path d="M-4,-12 L-19,-58 C-7,-62 7,-62 19,-58 L4,-12 Q0,-10 -4,-12 Z" fill="url(#limeSegment)"/>
        </g>
        <!-- 135 deg -->
        <g transform="rotate(135)">
          <path d="M-4,-12 L-19,-58 C-7,-62 7,-62 19,-58 L4,-12 Q0,-10 -4,-12 Z" fill="url(#limeSegment)"/>
        </g>
        <!-- 180 deg -->
        <g transform="rotate(180)">
          <path d="M-4,-12 L-19,-58 C-7,-62 7,-62 19,-58 L4,-12 Q0,-10 -4,-12 Z" fill="url(#limeSegment)"/>
        </g>
        <!-- 225 deg -->
        <g transform="rotate(225)">
          <path d="M-4,-12 L-19,-58 C-7,-62 7,-62 19,-58 L4,-12 Q0,-10 -4,-12 Z" fill="url(#limeSegment)"/>
        </g>
        <!-- 270 deg -->
        <g transform="rotate(270)">
          <path d="M-4,-12 L-19,-58 C-7,-62 7,-62 19,-58 L4,-12 Q0,-10 -4,-12 Z" fill="url(#limeSegment)"/>
        </g>
        <!-- 315 deg -->
        <g transform="rotate(315)">
          <path d="M-4,-12 L-19,-58 C-7,-62 7,-62 19,-58 L4,-12 Q0,-10 -4,-12 Z" fill="url(#limeSegment)"/>
        </g>
      </g>

      <!-- Center Star Pith Core -->
      <circle cx="0" cy="0" r="10" fill="#ffffff"/>
      <path d="M0,-11 L3,-3 L11,0 L3,3 L0,11 L-3,3 L-11,0 L-3,-3 Z" fill="#f1f8e9"/>

      <!-- Vesicle / Pulp Pearl Highlights inside segments -->
      <circle cx="0" cy="-38" r="2.5" fill="#ffffff" opacity="0.6"/>
      <circle cx="28" cy="-28" r="2.5" fill="#ffffff" opacity="0.6"/>
      <circle cx="38" cy="0" r="2.5" fill="#ffffff" opacity="0.6"/>
      <circle cx="28" cy="28" r="2.2" fill="#ffffff" opacity="0.5"/>
      <circle cx="-28" cy="-28" r="2.5" fill="#ffffff" opacity="0.6"/>
      <circle cx="-38" cy="0" r="2.2" fill="#ffffff" opacity="0.5"/>
      <circle cx="-28" cy="28" r="2" fill="#ffffff" opacity="0.4"/>
      <circle cx="0" cy="38" r="2" fill="#ffffff" opacity="0.4"/>

      <!-- Small teardrop vesicle textures -->
      <ellipse cx="-6" cy="-42" rx="3" ry="6" fill="#eeff41" opacity="0.4"/>
      <ellipse cx="6" cy="-32" rx="2.5" ry="5" fill="#eeff41" opacity="0.4"/>
      <ellipse cx="42" cy="-6" rx="6" ry="3" fill="#eeff41" opacity="0.4"/>
    </g>

    <!-- Glossy Curved Rim Shine -->
    <path d="M42,75 C60,48 100,40 145,55 C120,44 75,48 50,70 Z" fill="#ffffff" opacity="0.45"/>
    <!-- Fresh water droplets -->
    <ellipse cx="65" cy="55" rx="5" ry="3" transform="rotate(-30 65 55)" fill="#ffffff" opacity="0.7"/>
    <circle cx="145" cy="125" r="3" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>
