<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Lemon Rind Gradient -->
    <radialGradient id="lemonRind" cx="44%" cy="42%" r="60%">
      <stop offset="78%" stop-color="#eab308"/>
      <stop offset="90%" stop-color="#facc15"/>
      <stop offset="97%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>
    <!-- Pith Gradient -->
    <radialGradient id="lemonPith" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#ffffff"/>
      <stop offset="95%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </radialGradient>
    <!-- Segment Gradient -->
    <radialGradient id="lemonSegment" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="75%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </radialGradient>
    <!-- Leaf Gradient -->
    <linearGradient id="lemonLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="lemonShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="3" dy="8" stdDeviation="6" flood-color="#713f12" flood-opacity="0.32"/>
    </filter>
  </defs>

  <g filter="url(#lemonShadow)">
    <!-- Leaves behind -->
    <g transform="translate(144, 40) rotate(30)">
      <path d="M0,0 C26,-22 52,-8 46,24 C38,48 14,36 0,0 Z" fill="url(#lemonLeaf)"/>
      <path d="M0,0 Q26,8 44,22" stroke="#bbf7d0" stroke-width="2" fill="none"/>
    </g>

    <!-- Outer Yellow Peel / Rind -->
    <circle cx="100" cy="105" r="76" fill="url(#lemonRind)"/>

    <!-- Inner White Pith Ring -->
    <circle cx="100" cy="105" r="68" fill="url(#lemonPith)"/>

    <!-- 8 Triangular Citrus Pulp Wedges -->
    <g transform="translate(100, 105)">
      <!-- 0 deg -->
      <path d="M-4,-12 L-19,-58 C-7,-62 7,-62 19,-58 L4,-12 Q0,-10 -4,-12 Z" fill="url(#lemonSegment)"/>
      <!-- 45 deg -->
      <g transform="rotate(45)">
        <path d="M-4,-12 L-19,-58 C-7,-62 7,-62 19,-58 L4,-12 Q0,-10 -4,-12 Z" fill="url(#lemonSegment)"/>
      </g>
      <!-- 90 deg -->
      <g transform="rotate(90)">
        <path d="M-4,-12 L-19,-58 C-7,-62 7,-62 19,-58 L4,-12 Q0,-10 -4,-12 Z" fill="url(#lemonSegment)"/>
      </g>
      <!-- 135 deg -->
      <g transform="rotate(135)">
        <path d="M-4,-12 L-19,-58 C-7,-62 7,-62 19,-58 L4,-12 Q0,-10 -4,-12 Z" fill="url(#lemonSegment)"/>
      </g>
      <!-- 180 deg -->
      <g transform="rotate(180)">
        <path d="M-4,-12 L-19,-58 C-7,-62 7,-62 19,-58 L4,-12 Q0,-10 -4,-12 Z" fill="url(#lemonSegment)"/>
      </g>
      <!-- 225 deg -->
      <g transform="rotate(225)">
        <path d="M-4,-12 L-19,-58 C-7,-62 7,-62 19,-58 L4,-12 Q0,-10 -4,-12 Z" fill="url(#lemonSegment)"/>
      </g>
      <!-- 270 deg -->
      <g transform="rotate(270)">
        <path d="M-4,-12 L-19,-58 C-7,-62 7,-62 19,-58 L4,-12 Q0,-10 -4,-12 Z" fill="url(#lemonSegment)"/>
      </g>
      <!-- 315 deg -->
      <g transform="rotate(315)">
        <path d="M-4,-12 L-19,-58 C-7,-62 7,-62 19,-58 L4,-12 Q0,-10 -4,-12 Z" fill="url(#lemonSegment)"/>
      </g>

      <!-- Center Star Pith Core -->
      <circle cx="0" cy="0" r="10" fill="#ffffff"/>
      <path d="M0,-11 L3,-3 L11,0 L3,3 L0,11 L-3,3 L-11,0 L-3,-3 Z" fill="#fefce8"/>

      <!-- Delicate Citrus Pip / Seed inside wedge -->
      <path d="M12,-24 C16,-32 20,-30 22,-22 C22,-18 16,-18 12,-24 Z" fill="#fef9c3" opacity="0.85"/>
      <path d="M14,-23 Q18,-28 19,-22" stroke="#eab308" stroke-width="0.8" fill="none"/>

      <!-- Vesicle / Pulp Pearl Highlights -->
      <circle cx="0" cy="-38" r="2.5" fill="#ffffff" opacity="0.75"/>
      <circle cx="28" cy="-28" r="2.5" fill="#ffffff" opacity="0.75"/>
      <circle cx="38" cy="0" r="2.5" fill="#ffffff" opacity="0.7"/>
      <circle cx="28" cy="28" r="2.2" fill="#ffffff" opacity="0.65"/>
      <circle cx="-28" cy="-28" r="2.5" fill="#ffffff" opacity="0.75"/>
      <circle cx="-38" cy="0" r="2.2" fill="#ffffff" opacity="0.65"/>
      <circle cx="-28" cy="28" r="2" fill="#ffffff" opacity="0.55"/>
      <circle cx="0" cy="38" r="2" fill="#ffffff" opacity="0.55"/>

      <!-- Teardrop juicy highlights -->
      <ellipse cx="-6" cy="-42" rx="3" ry="6" fill="#ffffff" opacity="0.5"/>
      <ellipse cx="6" cy="-32" rx="2.5" ry="5" fill="#ffffff" opacity="0.45"/>
    </g>

    <!-- Glossy Rim Shine -->
    <path d="M42,75 C60,48 100,40 145,55 C120,44 75,48 50,70 Z" fill="#ffffff" opacity="0.5"/>
    <!-- Fresh water droplets -->
    <ellipse cx="68" cy="54" rx="5" ry="3" transform="rotate(-30 68 54)" fill="#ffffff" opacity="0.8"/>
    <circle cx="146" cy="122" r="3" fill="#ffffff" opacity="0.7"/>
  </g>
</svg>
